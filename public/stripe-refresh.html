<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configuration interrompue — Colosalle</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fff;
      color: #1a1a1a;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 420px; text-align: center; }
    .badge {
      width: 88px; height: 88px; border-radius: 50%;
      background: rgba(255, 165, 0, 0.12);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px; font-size: 40px;
    }
    h1 { font-size: 26px; line-height: 1.25; margin: 0 0 16px; }
    p { font-size: 16px; line-height: 1.55; color: #555; margin: 0 0 20px; }
    .action {
      background: #f5f5f5; border-radius: 14px;
      padding: 18px 20px; font-size: 15px; line-height: 1.5;
      color: #1a1a1a; text-align: left;
    }
    strong { color: #E33E47; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">⏳</div>
    <h1>Configuration interrompue</h1>
    <p>
      Le lien de configuration a expiré ou la procédure n'a pas été
      menée à son terme. Aucune information n'a été perdue.
    </p>
    <div class="action">
      Retournez dans l'application <strong>Colosalle</strong> et appuyez
      sur « <strong>Continuer la configuration</strong> » pour reprendre
      là où vous vous êtes arrêté.
    </div>
  </div>
</body>
</html>
